name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile
        run: python -m compileall -q mcp_aek tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check mcp_aek/static/app.js
      - name: Diff whitespace
        run: git diff --check
      - name: Import MCP server
        run: python -c "from mcp_aek.server import mcp; print(mcp.name)"
