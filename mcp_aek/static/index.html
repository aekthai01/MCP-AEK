<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#101214"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><title>AEK · Engineering workspace</title></head><body>
<div id="app"><aside id="rail"><a class="brand" href="/" aria-label="AEK home"><img src="/icon.svg" alt="">AEK<span>LOCAL ENGINE</span></a><button class="new" id="new">＋ New session</button><div class="section">WORKSPACE</div><button id="workspace" class="workspace">default ↗</button><div class="section">CONVERSATIONS</div><nav id="sessions" aria-label="Sessions"></nav><div class="rail-footer"><button data-panel="tools">⌘ Tools</button><button data-panel="diagnostics">◉ Diagnostics</button><button data-panel="settings">⚙ Settings</button></div></aside>
<main><header><button id="menu" aria-label="Toggle sessions" aria-expanded="false">☰</button><div><div id="title">Engineering workspace</div><small id="model">Connecting…</small></div><span id="connection" role="status">Connecting</span><button id="rename" aria-label="Rename session">✎</button></header>
<div id="notice" role="alert" hidden></div><section id="feed" aria-label="Conversation"><button id="older" hidden>Load earlier messages</button><div id="messages"></div></section><div id="activity" aria-live="polite"></div>
<footer><div class="composer"><textarea id="prompt" rows="1" maxlength="16000" placeholder="Give your workspace a task…" aria-label="Message"></textarea><button id="send" aria-label="Send message">↑</button></div><div class="hint"><span id="context">LOCAL TOOLS · PERSISTENT MEMORY</span><span>Enter ↵ · Shift + Enter</span></div></footer></main></div>
<dialog id="panel"><div class="panel-head"><h2 id="panel-title"></h2><button id="close" aria-label="Close panel">✕</button></div><div id="panel-body"></div></dialog><script src="/app.js" defer></script></body></html>
